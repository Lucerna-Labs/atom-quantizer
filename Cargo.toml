[package]
name = "atom-quantizer"
version = "0.2.4"
edition = "2021"
description = "Under-development atom-composed adaptive Q2/Q4/Q8 GGUF weight quantization research codec."

[lib]
name = "atom_quantizer"
path = "src/lib.rs"

[[bin]]
name = "atom-quantizer"
path = "src/main.rs"

[features]
default = []
cuda = ["dep:cudarc"]

[dependencies]
basis-engine = { path = "crates/basis-engine" }
sha2 = "0.10.9"
serde_json = "=1.0.149"
zip = { version = "=6.0.0", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
cudarc = { version = "0.17", default-features = false, features = ["cuda-12060", "cublas", "dynamic-loading"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"

[workspace]
members = [".", "crates/atom-quantizer-q2", "crates/basis-primitives", "crates/basis-engine"]
resolver = "2"
